<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}标注训练平台{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <script>
    (function () {
      var theme = localStorage.getItem("act_train_theme") || "light";
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    })();
  </script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">AT</div>
      <div>
        <div class="brand-title">标注训练平台</div>
        <div class="brand-subtitle">act_train_platform {{ version }}</div>
      </div>
    </div>
    <nav class="nav">
      <a href="/" class="{% if page_id == 'overview' %}active{% endif %}">总览</a>
      <a href="/labels" class="{% if page_id == 'labels' %}active{% endif %}">标签字典</a>
      <a href="/projects" class="{% if page_id == 'projects' %}active{% endif %}">产品配置</a>
      <a href="/videos" class="{% if page_id == 'videos' %}active{% endif %}">视频与抽帧</a>
      <a href="/task-annotate" class="{% if page_id == 'task_annotate' %}active{% endif %}">三任务标注工作台</a>
      <a href="/annotate" class="{% if page_id == 'annotate' %}active{% endif %}">原矩形标注工作台</a>
      <a href="/datasets" class="{% if page_id == 'datasets' %}active{% endif %}">训练数据集</a>
      <a href="/training" class="{% if page_id == 'training' %}active{% endif %}">模型训练任务</a>
      <a href="/packages" class="{% if page_id == 'packages' %}active{% endif %}">模型仓库</a>
    </nav>
    <button class="theme-toggle" id="theme-toggle" type="button">切换深浅色</button>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
  <div id="toast" class="toast"></div>
  <div id="help-modal" class="modal-backdrop">
    <div class="modal">
      <button class="modal-close" type="button">关闭</button>
      <h2 id="help-title"></h2>
      <p id="help-body"></p>
      <pre id="help-example"></pre>
    </div>
  </div>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/help_registry.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
