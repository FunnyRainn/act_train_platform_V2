{% extends "base.html" %}
{% block title %}标注工作台 - 标注训练平台{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <h1>标注工作台</h1>
    <p>画框、调整框、标记关键帧，并用跟踪对象生成中间帧。</p>
  </div>
</section>
<section class="annotator">
  <aside class="panel annotator-side">
    <label>帧集<select id="frame-set-select"></select></label>
    <label>标签<select id="label-select"></select></label>
    <label>跟踪对象 <button class="help-dot" type="button" data-help-key="track_object">?</button><input id="track-id" placeholder="留空后点击新建跟踪对象"></label>
    <label class="inline"><input type="checkbox" id="is-keyframe"> 当前框为关键帧</label>
    <button id="new-track-btn">新建跟踪对象</button>
    <button id="save-frame-btn" class="primary">手动保存</button>
    <button id="interpolate-btn">生成中间帧</button>
    <button id="clear-boxes-btn">清空当前画面框</button>
    <div id="save-status" class="row-meta">自动保存就绪</div>
    <hr>
    <label>旧模型路径<input id="prelabel-model" placeholder="D:\models\best.pt"></label>
    <button id="prelabel-btn">运行预标注</button>
    <div id="box-list" class="box-list"></div>
  </aside>
  <section class="panel annotator-main">
    <div class="frame-toolbar">
      <button id="prev-frame">上一帧</button>
      <span id="frame-info">未选择帧</span>
      <button id="next-frame">下一帧</button>
    </div>
    <div class="canvas-wrap">
      <img id="frame-image" alt="当前帧">
      <canvas id="bbox-canvas"></canvas>
    </div>
  </section>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/js/annotate.js"></script>
{% endblock %}
