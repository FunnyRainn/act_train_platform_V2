{% extends "base.html" %}
{% block title %}标注工作台 - 标注训练平台{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <h1>标注工作台 <button class="help-dot" type="button" data-help-key="annotation_workspace">?</button></h1>
    <p>画框、调整框、标记关键帧，并用跟踪对象生成中间帧。</p>
  </div>
</section>
<section class="annotator">
  <aside class="panel annotator-side">
    <label>帧集<select id="frame-set-select"></select></label>
    <label>标签<select id="label-select"></select></label>
    <label>
      <span class="label-title">跟踪对象 <button class="help-dot" type="button" data-help-key="track_object">?</button></span>
      <input id="track-id" placeholder="留空后点击新建跟踪对象">
    </label>
    <label class="inline"><input type="checkbox" id="is-keyframe"> 当前框为关键帧</label>
    <button id="new-track-btn">新建跟踪对象</button>
    <button id="save-frame-btn" class="primary">手动保存</button>
    <button id="interpolate-btn">生成中间帧 <span class="inline-help" data-help-key="interpolate_frames">?</span></button>
    <button id="clear-boxes-btn">清空当前画面框</button>
    <div id="save-status" class="row-meta">自动保存就绪</div>
    <hr>
    <div class="focus-region-panel">
      <div class="label-title">关注区域 <button class="help-dot" type="button" data-help-key="focus_region">?</button></div>
      <input id="focus-region-name" placeholder="例如：短边打带区">
      <div class="button-row">
        <button id="focus-new-btn" type="button">新建关注区域</button>
        <button id="focus-confirm-btn" type="button">确认并锁定</button>
        <button id="focus-cancel-btn" type="button">取消编辑</button>
      </div>
      <div id="focus-region-list" class="focus-region-list"></div>
      <div class="row-meta">存在关注区域时，只允许在区域内标注。编辑关注区域需要先从列表点击“编辑”，确认后对当前产品全部帧生效。</div>
    </div>
    <hr>
    <label>
      <span class="label-title">旧模型路径 <button class="help-dot" type="button" data-help-key="prelabel">?</button></span>
      <input id="prelabel-model" placeholder="D:\models\PieV2S_Best.pt">
    </label>
    <label>
      <span class="label-title">预标注置信度 <button class="help-dot" type="button" data-help-key="prelabel_confidence">?</button></span>
      <input id="prelabel-conf" type="number" min="0.05" max="0.95" step="0.05" value="0.25">
    </label>
    <button id="prelabel-btn">运行预标注</button>
    <button id="confirm-prelabels-btn" type="button">确认当前帧集全部预标注</button>
    <button id="clear-prelabels-btn" type="button">清空全部预标注框</button>
    <div id="prelabel-status" class="row-meta">预标注空闲</div>
    <div id="box-list" class="box-list"></div>
  </aside>
  <section class="panel annotator-main">
    <div class="frame-toolbar">
      <button id="prev-frame">上一帧</button>
      <span id="frame-info">未选择帧</span>
      <button id="next-frame">下一帧</button>
    </div>
    <div class="canvas-wrap">
      <img id="frame-image" alt="当前帧">
      <canvas id="bbox-canvas"></canvas>
    </div>
  </section>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/js/annotate.js?v=1.2.0.0"></script>
{% endblock %}
