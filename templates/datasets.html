{% extends "base.html" %}
{% block title %}训练数据集 - 标注训练平台{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <h1>训练数据集 <button class="help-dot" type="button" data-help-key="dataset">?</button></h1>
    <p>把已确认标注导出为不可变训练数据集版本。</p>
  </div>
</section>
<section class="layout-two">
  <form class="panel form" id="dataset-form">
    <h2>导出数据集</h2>
    <label>产品<select name="project_id"></select></label>
    <label>版本名称<input name="name" value="训练数据集 v1"></label>
    <label>帧集<select name="frame_set_ids" multiple size="10"></select></label>
    <label>混入历史数据集<select name="history_dataset_ids" multiple size="6"></select></label>
    <div class="button-row">
      <button class="primary" type="submit">导出训练数据集</button>
      <button type="button" id="export-annotated-only">只导出已标注帧</button>
    </div>
  </form>
  <section class="panel">
    <h2>训练数据集列表</h2>
    <div id="dataset-list" class="table-list"></div>
  </section>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/js/datasets.js"></script>
{% endblock %}
