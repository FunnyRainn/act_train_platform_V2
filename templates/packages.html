{% extends "base.html" %}
{% block title %}模型仓库 - 标注训练平台{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <h1>模型仓库 <button class="help-dot" type="button" data-help-key="model_repo">?</button></h1>
    <p>这里保存历史训练产生的可部署模型目录。复制整个目录到推理服务器后，在推理服务配置中指向该目录即可。</p>
  </div>
</section>
<section class="panel">
  <h2>模型仓库列表</h2>
  <div class="notice">
    模型目录由训练任务自动生成。训练完成或手动停止后，只要已经产生可用模型文件，系统会自动整理到这里。
  </div>
  <div id="package-list" class="table-list"></div>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/js/packages.js?v=1.0.0.8"></script>
{% endblock %}
