{% extends "base.html" %}
{% block title %}模型包 - 标注训练平台{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <h1>模型包</h1>
    <p>模型包用于人工复制到 act_server 推理服务器。</p>
  </div>
</section>
<section class="layout-two">
  <form class="panel form" id="package-form">
    <h2>导出模型包</h2>
    <label>训练任务<select name="train_job_id"></select></label>
    <label>模型包名称<input name="name" value="模型包 v1"></label>
    <button class="primary" type="submit">导出模型包</button>
  </form>
  <section class="panel">
    <h2>模型包列表</h2>
    <div id="package-list" class="table-list"></div>
  </section>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/js/packages.js"></script>
{% endblock %}
